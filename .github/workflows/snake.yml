name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate year stats card
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import datetime
          import json
          import os
          import urllib.request

          login = os.environ["LOGIN"]
          token = os.environ["GH_TOKEN"]

          query = (
              "query($login:String!){user(login:$login){contributionsCollection{"
              "contributionCalendar{totalContributions weeks{contributionDays{"
              "date contributionCount}}}}}}"
          )
          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps({"query": query, "variables": {"login": login}}).encode(),
              headers={
                  "Authorization": "bearer " + token,
                  "Content-Type": "application/json",
                  "User-Agent": "year-stats-card",
              },
          )
          payload = json.load(urllib.request.urlopen(req))
          calendar = payload["data"]["user"]["contributionsCollection"]["contributionCalendar"]

          days = [d for week in calendar["weeks"] for d in week["contributionDays"]]
          days.sort(key=lambda d: d["date"])

          total = calendar["totalContributions"]
          active = sum(1 for d in days if d["contributionCount"] > 0)
          busiest = max(d["contributionCount"] for d in days)

          longest = run = 0
          for d in days:
              run = run + 1 if d["contributionCount"] > 0 else 0
              longest = max(longest, run)

          TEMPLATE = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-labelledby="ys-title">
            <title id="ys-title">A year of building: GitHub contribution summary</title>
            <defs>
              <linearGradient id="ys-bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#0D1626"/>
                <stop offset="1" stop-color="#13264A"/>
              </linearGradient>
              <linearGradient id="ys-line" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#22D3EE"/>
                <stop offset="0.7" stop-color="#1F5FA8"/>
                <stop offset="1" stop-color="#1F5FA8" stop-opacity="0"/>
              </linearGradient>
            </defs>

            <rect x="1" y="1" width="998" height="218" rx="14" fill="url(#ys-bg)" stroke="#1F5FA8" stroke-opacity="0.5"/>

            <text x="32" y="42" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#22D3EE">// CONTRIBUTION LOG  &#183;  REAL GITHUB DATA</text>
            <text x="968" y="42" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1" fill="#9CC9E8" fill-opacity="0.7">UPDATED @@DATE@@ UTC</text>

            <text x="32" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#EAF2F8">A year of building.</text>

            <rect x="32" y="112" width="300" height="2" rx="1" fill="url(#ys-line)">
              <animate attributeName="width" values="0;300" dur="1.2s" fill="freeze"/>
            </rect>

            <g stroke="#1F5FA8" stroke-opacity="0.4">
              <line x1="264" y1="144" x2="264" y2="200"/>
              <line x1="512" y1="144" x2="512" y2="200"/>
              <line x1="760" y1="144" x2="760" y2="200"/>
            </g>

            <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700">
              <text x="32" y="174" fill="#22D3EE">@@TOTAL@@<animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze"/></text>
              <text x="280" y="174" fill="#EAF2F8">@@ACTIVE@@<animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/></text>
              <text x="528" y="174" fill="#EAF2F8">@@STREAK@@<animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/></text>
              <text x="776" y="174" fill="#EAF2F8">@@BUSIEST@@<animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/></text>
            </g>

            <g font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#9CC9E8">
              <text x="32" y="198">CONTRIBUTIONS</text>
              <text x="280" y="198">ACTIVE DAYS</text>
              <text x="528" y="198">LONGEST STREAK</text>
              <text x="776" y="198">BUSIEST DAY</text>
            </g>
          </svg>
          '''

          svg = (
              TEMPLATE.replace("@@TOTAL@@", format(total, ","))
              .replace("@@ACTIVE@@", format(active, ","))
              .replace("@@STREAK@@", format(longest, ","))
              .replace("@@BUSIEST@@", format(busiest, ","))
              .replace("@@DATE@@", datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"))
          )

          os.makedirs("dist", exist_ok=True)
          with open("dist/year-stats.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          print("year-stats.svg written:", total, active, longest, busiest)
          PY

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#EAF2F8&color_dots=#13264A,#17406F,#1F5FA8,#2F9BD0,#22D3EE
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Deploy Snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
