<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-labelledby="hf-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="hf-title">Always learning. Always building.</title>

  <defs>
    <linearGradient id="hf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1626"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="hf-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="hf-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="hf-b"/>
      <feMerge>
        <feMergeNode in="hf-b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="110" fill="url(#hf-bg)"/>
  <rect x="0" y="0" width="1200" height="2" fill="url(#hf-line)"/>

  <rect x="400" y="0" width="120" height="2" fill="#EAF2F8" opacity="0">
    <animate attributeName="x" values="0;1080" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g fill="#22D3EE" filter="url(#hf-glow)">
    <circle cx="570" cy="28" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="28" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="630" cy="28" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="68" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#9CC9E8">Always learning. Always building.</text>
  <text x="600" y="94" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#22D3EE" fill-opacity="0.85">MUHAMMAD HARIS NAEEM  //  BS AI  //  FUUAST ISLAMABAD</text>
</svg>
