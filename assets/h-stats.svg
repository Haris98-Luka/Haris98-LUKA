<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-label="GitHub Stats" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>GitHub Stats</title>
  <defs>
    <linearGradient id="hd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1626"/>
      <stop offset="1" stop-color="#13264A"/>
    </linearGradient>
    <linearGradient id="hd-txt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="196" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="hd-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="hd-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hd-clip"><rect x="1" y="1" width="998" height="62" rx="12"/></clipPath>
  </defs>

  <rect x="1" y="1" width="998" height="62" rx="12" fill="url(#hd-bg)" stroke="#A78BFA" stroke-opacity="0.35"/>

  <rect x="18" y="16" width="6" height="32" rx="3" fill="url(#hd-bar)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </rect>

