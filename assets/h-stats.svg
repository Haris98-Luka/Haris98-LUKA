  <path transform="translate(954.5 38)" d="M0.8 -1.4V-9.1L2.2 -10.5H7.5L8.9 -9.1V-1.4L7.5 0H2.2ZM2.6 -8.9V-1.6H7.2V-8.9Z M20.7 -9H14.3V-6.4L20.7 -5.9V-1.4L19.3 0H12.7V-1.5H18.9V-4.6L12.6 -5.1V-10.5H20.7Z" fill="#38BDF8" fill-opacity="0.75"/>

