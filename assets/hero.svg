<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="hh-title hh-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="hh-title">Muhammad Haris Naeem</title>
  <desc id="hh-desc">Animated banner: AI Student, Aspiring Software Developer, Problem Solver.</desc>

  <defs>
    <linearGradient id="hh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0D1626"/>
      <stop offset="1" stop-color="#13264A"/>
    </linearGradient>

    <radialGradient id="hh-glow" cx="0.75" cy="0.4" r="0.5">
      <animate attributeName="cx" values="0.68;0.82;0.68" dur="12s" repeatCount="indefinite"/>
      <stop offset="0" stop-color="#1F5FA8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1F5FA8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="hh-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9CC9E8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>

    <radialGradient id="hh-fadeg" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <mask id="hh-fade">
      <rect width="1200" height="380" fill="url(#hh-fadeg)"/>
    </mask>

    <linearGradient id="hh-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EAF2F8"/>
      <stop offset="1" stop-color="#9CC9E8"/>
    </linearGradient>

    <linearGradient id="hh-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.6" stop-color="#1F5FA8"/>
      <stop offset="1" stop-color="#1F5FA8" stop-opacity="0"/>
    </linearGradient>

    <filter id="hh-blur" x="-10%" y="-800%" width="120%" height="1700%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="hh-glow-f" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="hh-b"/>
      <feMerge>
        <feMergeNode in="hh-b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#hh-bg)"/>
  <rect width="1200" height="380" fill="url(#hh-glow)"/>
  <rect width="1200" height="380" fill="url(#hh-grid)" mask="url(#hh-fade)"/>

  <!-- Scan line -->
  <rect x="0" y="0" width="1200" height="2" fill="#22D3EE" opacity="0.08">
    <animate attributeName="y" values="0;380" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Frame + corner brackets -->
  <rect x="12" y="12" width="1176" height="356" fill="none" stroke="#1F5FA8" stroke-opacity="0.35"/>
  <g fill="none" stroke="#22D3EE" stroke-opacity="0.8" stroke-width="2">
    <path d="M24 56V24H56"/>
    <path d="M1144 24H1176V56"/>
    <path d="M24 324V356H56"/>
    <path d="M1144 356H1176V324"/>
  </g>

  <!-- Orbital geometry -->
  <g transform="translate(960 150)">
    <circle r="140" fill="none" stroke="#9CC9E8" stroke-opacity="0.15"/>
    <circle r="105" fill="none" stroke="#1F5FA8" stroke-opacity="0.7"/>
    <circle r="70" fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-dasharray="2 6"/>

    <g>
      <ellipse rx="140" ry="50" fill="none" stroke="#22D3EE" stroke-opacity="0.3" transform="rotate(-25)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </g>

    <g>
      <circle cx="105" cy="0" r="4" fill="#22D3EE" filter="url(#hh-glow-f)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="70" cy="0" r="3" fill="#EAF2F8" filter="url(#hh-glow-f)"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </g>

    <circle r="24" fill="none" stroke="#22D3EE" stroke-opacity="0.5">
      <animate attributeName="r" values="8;28" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#22D3EE" filter="url(#hh-glow-f)"/>
  </g>

  <!-- Circuit path (static base + animated trace) -->
  <path d="M560 330H700L730 300H880L910 330H1140" fill="none" stroke="#1F5FA8" stroke-width="2" stroke-opacity="0.8"/>
  <path id="hh-circuit" d="M560 330H700L730 300H880L910 330H1140" fill="none" stroke="#22D3EE" stroke-width="2" pathLength="1000" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0 1000;1000 0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.85;1" dur="6s" repeatCount="indefinite"/>
  </path>
  <g fill="#0D1626" stroke="#22D3EE" stroke-width="2">
    <circle cx="700" cy="330" r="4"/>
    <circle cx="730" cy="300" r="4"/>
    <circle cx="880" cy="300" r="4"/>
    <circle cx="910" cy="330" r="4"/>
  </g>
  <circle cx="0" cy="0" r="4" fill="#EAF2F8" opacity="0" filter="url(#hh-glow-f)">
    <set attributeName="opacity" to="1" begin="0s"/>
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath xlink:href="#hh-circuit"/>
    </animateMotion>
  </circle>

  <!-- Text -->
  <text x="70" y="105" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="3" fill="#22D3EE">&gt; BS ARTIFICIAL INTELLIGENCE  //  FUUAST ISLAMABAD</text>

  <text x="70" y="178" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="1" fill="url(#hh-name)">MUHAMMAD HARIS NAEEM</text>

  <text x="70" y="222" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#9CC9E8">AI Student  ·  Aspiring Software Developer  ·  Problem Solver</text>

  <!-- Glowing underline -->
  <rect x="70" y="244" width="520" height="3" rx="1.5" fill="#22D3EE" opacity="0.6" filter="url(#hh-blur)"/>
  <rect x="70" y="244" width="520" height="3" rx="1.5" fill="url(#hh-line)"/>
  <rect x="70" y="244" width="80" height="3" rx="1.5" fill="#EAF2F8" opacity="0">
    <animate attributeName="x" values="70;510" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="70" y="300" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#9CC9E8" fill-opacity="0.8">// learning  ·  building  ·  shipping</text>
</svg>
