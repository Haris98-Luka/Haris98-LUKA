<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 248" width="1000" height="248" role="img" aria-label="Current focus. Learning: Artificial Intelligence and Machine Learning, Data structures and algorithms, Object-oriented design, SQL and database fundamentals. Building: Practical software projects, Clean, modular C++ and Python programs, Small tools that solve real problems, Better Git and GitHub habits." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
