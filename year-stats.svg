<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-labelledby="ys-title">
  <title id="ys-title">A year of building: GitHub contribution summary</title>
  <defs>
    <linearGradient id="ys-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1626"/>
      <stop offset="1" stop-color="#13264A"/>
    </linearGradient>
    <linearGradient id="ys-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.7" stop-color="#1F5FA8"/>
      <stop offset="1" stop-color="#1F5FA8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="218" rx="14" fill="url(#ys-bg)" stroke="#1F5FA8" stroke-opacity="0.5"/>

  <text x="32" y="42" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#22D3EE">// CONTRIBUTION LOG  &#183;  REAL GITHUB DATA</text>
  <text x="968" y="42" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1" fill="#9CC9E8" fill-opacity="0.7">UPDATED 2026-10-22 UTC</text>

  <text x="32" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#EAF2F8">A year of building.</text>

  <rect x="32" y="112" width="300" height="2" rx="1" fill="url(#ys-line)">
    <animate attributeName="width" values="0;300" dur="1.2s" fill="freeze"/>
  </rect>

  <g stroke="#1F5FA8" stroke-opacity="0.4">
    <line x1="264" y1="144" x2="264" y2="200"/>
    <line x1="512" y1="144" x2="512" y2="200"/>
    <line x1="760" y1="144" x2="760" y2="200"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700">
    <text x="32" y="174" fill="#22D3EE">921<animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze"/></text>
    <text x="280" y="174" fill="#EAF2F8">29<animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/></text>
    <text x="528" y="174" fill="#EAF2F8">9<animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/></text>
    <text x="776" y="174" fill="#EAF2F8">77<animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/></text>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#9CC9E8">
    <text x="32" y="198">CONTRIBUTIONS</text>
    <text x="280" y="198">ACTIVE DAYS</text>
    <text x="528" y="198">LONGEST STREAK</text>
    <text x="776" y="198">BUSIEST DAY</text>
  </g>
</svg>
